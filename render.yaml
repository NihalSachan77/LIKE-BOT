services:
  - type: web
    name: nxt-like-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DEFAULT_CHANNEL
        value: "@trynexttime"
      - key: LIKE_API_URL
        sync: false
      - key: FREE_DAILY_LIMIT
        value: "3"
      - key: PREMIUM_DAILY_LIMIT
        value: "50"
      - key: AUTOLIKE_TIME
        value: "09:00"
